name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  LLVM_REPO: https://github.com/retsimx/llvm-project.git
  LLVM_BRANCH: tc32

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check
        working-directory: rust

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clippy
        run: cargo clippy --lib --target i686-unknown-linux-gnu -- -D warnings
        working-directory: rust

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run tests with coverage
        run: LCOV_OUTPUT=lcov.info ./run_tests.sh
        working-directory: rust

      - name: Extract coverage summary
        id: coverage
        working-directory: rust
        run: |
          SUMMARY=$(cargo llvm-cov report --branch --target i686-unknown-linux-gnu \
            --summary-only 2>&1 | grep -E "^TOTAL" || true)
          # Parse: TOTAL <lines> <covered> <pct> <funcs> <covered_f> <pct_f> <regions> ...
          LINE_PCT=$(echo "$SUMMARY" | awk '{print $4}')
          FUNC_PCT=$(echo "$SUMMARY" | awk '{print $7}')
          REGION_PCT=$(echo "$SUMMARY" | awk '{print $10}')
          echo "line_pct=${LINE_PCT}" >> "$GITHUB_OUTPUT"
          echo "func_pct=${FUNC_PCT}" >> "$GITHUB_OUTPUT"
          echo "region_pct=${REGION_PCT}" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const linePct  = '${{ steps.coverage.outputs.line_pct }}';
            const funcPct  = '${{ steps.coverage.outputs.func_pct }}';
            const regionPct = '${{ steps.coverage.outputs.region_pct }}';
            const body = [
              '## 📊 Coverage Report',
              '',
              '| Metric  | Coverage |',
              '|---------|----------|',
              `| Lines   | ${linePct} |`,
              `| Functions | ${funcPct} |`,
              `| Regions | ${regionPct} |`,
            ].join('\n');

            // Update existing comment if present, otherwise create new one
            const marker = '## 📊 Coverage Report';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  llvm:
    name: Build LLC
    runs-on: ubuntu-latest
    outputs:
      llc-cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Get LLVM HEAD commit
        id: llvm-rev
        run: |
          REV=$(git ls-remote "$LLVM_REPO" "refs/heads/$LLVM_BRANCH" | cut -f1)
          echo "rev=${REV}" >> "$GITHUB_OUTPUT"

      - name: Cache LLC binary
        id: cache
        uses: actions/cache@v4
        with:
          path: llvm-install/bin/llc
          key: llc-${{ steps.llvm-rev.outputs.rev }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y cmake ninja-build clang lld

      - name: Clone LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b "$LLVM_BRANCH" "$LLVM_REPO" llvm-project

      - name: Configure LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja \
            -S llvm-project/llvm \
            -B llvm-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_TARGETS_TO_BUILD=ARM \
            -DLLVM_TOOLS_TO_BUILD=llc \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX=llvm-install

      - name: Build LLC
        if: steps.cache.outputs.cache-hit != 'true'
        run: ninja -C llvm-build llc

      - name: Install LLC
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p llvm-install/bin
          cp llvm-build/bin/llc llvm-install/bin/llc

      - name: Upload LLC artifact
        uses: actions/upload-artifact@v4
        with:
          name: llc
          path: llvm-install/bin/llc
          retention-days: 7

  firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    needs: llvm
    steps:
      - uses: actions/checkout@v4

      - name: Download LLC
        uses: actions/download-artifact@v4
        with:
          name: llc
          path: llc-bin

      - name: Make LLC executable
        run: chmod +x llc-bin/llc

      - name: Install Rust toolchain
        run: rustup show  # triggers rust-toolchain.toml
        working-directory: rust

      - name: Build firmware
        run: make LLC="$GITHUB_WORKSPACE/llc-bin/llc"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightblemesh.bin
          path: _build/lightblemesh.bin
          retention-days: 30
