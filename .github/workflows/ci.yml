name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  LLVM_REPO: https://github.com/retsimx/llvm-project.git
  LLVM_BRANCH: tc32

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check
        working-directory: rust

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clippy
        run: cargo clippy --lib --target i686-unknown-linux-gnu -- -D warnings
        working-directory: rust

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit build dependencies
        # Refresh the package index first: runner images bake an apt list that
        # can point at libc6-dev-i386/libc6-x32 versions the archive has since
        # superseded, which fails the install with 404s.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          # >=0.8.6 required for Cargo 1.100+ build/<crate>/<hash>/out/ layout
          tool: cargo-llvm-cov@0.9.2

      - name: Run tests with coverage
        id: coverage
        working-directory: rust
        run: |
          set -o pipefail
          ./run_tests.sh 2>&1 | tee /tmp/coverage-output.txt
          TOTAL=$(grep -E "^TOTAL" /tmp/coverage-output.txt | tail -1)
          REGION_PCT=$(echo "$TOTAL" | awk '{print $4}')
          FUNC_PCT=$(echo "$TOTAL"   | awk '{print $7}')
          LINE_PCT=$(echo "$TOTAL"   | awk '{print $10}')
          BRANCH_PCT=$(echo "$TOTAL" | awk '{print $13}')
          echo "region_pct=${REGION_PCT}" >> "$GITHUB_OUTPUT"
          echo "func_pct=${FUNC_PCT}"     >> "$GITHUB_OUTPUT"
          echo "line_pct=${LINE_PCT}"     >> "$GITHUB_OUTPUT"
          echo "branch_pct=${BRANCH_PCT}" >> "$GITHUB_OUTPUT"

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const regionPct = '${{ steps.coverage.outputs.region_pct }}';
            const funcPct   = '${{ steps.coverage.outputs.func_pct }}';
            const linePct   = '${{ steps.coverage.outputs.line_pct }}';
            const branchPct = '${{ steps.coverage.outputs.branch_pct }}';
            const body = [
              '## 📊 Coverage Report',
              '',
              '| Metric    | Coverage |',
              '|-----------|----------|',
              `| Lines     | ${linePct} |`,
              `| Functions | ${funcPct} |`,
              `| Regions   | ${regionPct} |`,
              `| Branches  | ${branchPct} |`,
            ].join('\n');
            const marker = '## 📊 Coverage Report';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  python-wire-contracts:
    name: Python Wire Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r utilities/meshutils/requirements.txt
      - run: PYTHONPATH=utilities/meshutils python3 -m unittest discover -s utilities/meshutils/tests -v

  probe:
    name: Probe tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install probe toolchain
        run: rustup show  # triggers tools/probe/rust-toolchain.toml
        working-directory: tools/probe
      - name: Check formatting
        run: cargo fmt --check
        working-directory: tools/probe
      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: tools/probe
      - name: Run tests
        run: cargo test
        working-directory: tools/probe
      - name: Build probe-pico for RP2040
        run: cargo build --manifest-path probe-pico/Cargo.toml --release --target thumbv6m-none-eabi
        working-directory: tools/probe

  sdk-tests:
    name: SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run build driver tests
        run: python3 -m unittest discover -s sdk/tests -v

  llvm:
    name: Build LLVM tools
    runs-on: ubuntu-latest
    outputs:
      llc-cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Get LLVM HEAD commit
        id: llvm-rev
        run: |
          REV=$(git ls-remote "$LLVM_REPO" "refs/heads/$LLVM_BRANCH" | cut -f1)
          echo "rev=${REV}" >> "$GITHUB_OUTPUT"

      - name: Cache LLVM binaries
        id: cache
        uses: actions/cache@v4
        with:
          path: llvm-install/bin
          key: llvm-tools-${{ steps.llvm-rev.outputs.rev }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y cmake ninja-build clang lld

      - name: Clone LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b "$LLVM_BRANCH" "$LLVM_REPO" llvm-project

      - name: Configure LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja \
            -S llvm-project/llvm \
            -B llvm-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_TARGETS_TO_BUILD=ARM \
            -DLLVM_ENABLE_PROJECTS=lld \
            -DLLVM_TOOLS_TO_BUILD="llc;llvm-link;opt" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX=llvm-install

      - name: Build LLVM tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ninja -C llvm-build llc llvm-link opt \
            ld.lld llvm-objcopy llvm-objdump llvm-nm

      - name: Install LLVM tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p llvm-install/bin
          cp llvm-build/bin/llc llvm-install/bin/llc
          cp llvm-build/bin/llvm-link llvm-install/bin/llvm-link
          cp llvm-build/bin/opt llvm-install/bin/opt
          cp llvm-build/bin/ld.lld llvm-install/bin/ld.lld
          cp llvm-build/bin/llvm-objcopy llvm-install/bin/llvm-objcopy
          cp llvm-build/bin/llvm-objdump llvm-install/bin/llvm-objdump
          cp llvm-build/bin/llvm-nm llvm-install/bin/llvm-nm

      - name: Upload LLVM tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-tools
          path: llvm-install/bin
          retention-days: 7

  firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    needs: llvm
    steps:
      - uses: actions/checkout@v4

      - name: Download LLVM tools
        uses: actions/download-artifact@v4
        with:
          name: llvm-tools
          path: llvm-bin

      - name: Make LLVM tools executable
        run: chmod +x llvm-bin/llc llvm-bin/llvm-link llvm-bin/opt llvm-bin/ld.lld llvm-bin/llvm-objcopy llvm-bin/llvm-objdump llvm-bin/llvm-nm

      - name: Install Rust toolchain
        run: rustup show  # triggers rust-toolchain.toml
        working-directory: rust

      - name: Build firmware
        run: |
          make \
            LLC="$GITHUB_WORKSPACE/llvm-bin/llc" \
            LLVM_LINK="$GITHUB_WORKSPACE/llvm-bin/llvm-link" \
            OPT="$GITHUB_WORKSPACE/llvm-bin/opt" \
            LD="$GITHUB_WORKSPACE/llvm-bin/ld.lld" \
            OBJCOPY="$GITHUB_WORKSPACE/llvm-bin/llvm-objcopy"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Check static stack/RAM budget
        run: make stack-check
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Check firmware image size (< 128 KiB)
        run: make image-size-check
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Build firmware with RTT logging
        run: |
          make FEATURES=rtt \
            LLC="$GITHUB_WORKSPACE/llvm-bin/llc" \
            LLVM_LINK="$GITHUB_WORKSPACE/llvm-bin/llvm-link" \
            OPT="$GITHUB_WORKSPACE/llvm-bin/opt" \
            LD="$GITHUB_WORKSPACE/llvm-bin/ld.lld" \
            OBJCOPY="$GITHUB_WORKSPACE/llvm-bin/llvm-objcopy"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Check RTT build stack/RAM budget
        run: make stack-check
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Check RTT build image size (< 128 KiB)
        run: make image-size-check
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Rebuild default firmware
        run: |
          make \
            LLC="$GITHUB_WORKSPACE/llvm-bin/llc" \
            LLVM_LINK="$GITHUB_WORKSPACE/llvm-bin/llvm-link" \
            OPT="$GITHUB_WORKSPACE/llvm-bin/opt" \
            LD="$GITHUB_WORKSPACE/llvm-bin/ld.lld" \
            OBJCOPY="$GITHUB_WORKSPACE/llvm-bin/llvm-objcopy"
          make check
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          LLVM_OBJDUMP: ${{ github.workspace }}/llvm-bin/llvm-objdump
          LLVM_NM: ${{ github.workspace }}/llvm-bin/llvm-nm

      - name: Verify manifest cache hit on no-op rebuild
        run: |
          set -euo pipefail
          if [ ! -f _build/default/merged.o ]; then
            echo "::error::_build/default/merged.o not found; the default build did not produce per-feature intermediates" >&2
            exit 1
          fi
          before=$(stat -c %y _build/default/merged.o)
          echo "merged.o mtime before: ${before}"
          if ! output=$(make \
            LLC="$GITHUB_WORKSPACE/llvm-bin/llc" \
            LLVM_LINK="$GITHUB_WORKSPACE/llvm-bin/llvm-link" \
            OPT="$GITHUB_WORKSPACE/llvm-bin/opt" \
            LD="$GITHUB_WORKSPACE/llvm-bin/ld.lld" \
            OBJCOPY="$GITHUB_WORKSPACE/llvm-bin/llvm-objcopy" 2>&1); then
            echo "$output"
            echo "::error::no-op rebuild failed: make exited non-zero" >&2
            exit 1
          fi
          echo "$output"
          after=$(stat -c %y _build/default/merged.o)
          echo "merged.o mtime after:  ${after}"
          failed=0
          if [ "$before" != "$after" ]; then
            echo "::error::_build/default/merged.o was rewritten on a no-op rebuild (mtime ${before} -> ${after})" >&2
            failed=1
          fi
          if ! printf '%s\n' "$output" | grep -Fq "Build manifest unchanged for 'default'; skipping LLVM/TC32 link."; then
            echo "::error::missing manifest cache-hit message; no-op rebuild did not skip the LLVM/TC32 link" >&2
            failed=1
          fi
          exit "$failed"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightblemesh.bin
          path: _build/lightblemesh.bin
          retention-days: 30
