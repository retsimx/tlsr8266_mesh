[workspace]
members = [
    ".",
    "crates/mesh-protocol",
    "crates/tlsr8266-pac",
    "crates/tlsr8266-hal",
    "crates/tlsr8266-radio",
    "crates/tlsr8266-platform",
]
resolver = "2"

[package]
name = "tlsr8266_mesh"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
# Size first: rustc marks functions optsize/minsize, which the post-link `opt`
# pipeline honours. Whole-program IR linking already provides the LTO step, so
# Cargo's own `lto` stays off.
opt-level = "s"
codegen-units = 1
lto = false
panic = "abort"

[dependencies]
mesh-protocol = { path = "crates/mesh-protocol" }
tlsr8266-pac = { path = "crates/tlsr8266-pac" }
tlsr8266-hal = { path = "crates/tlsr8266-hal" }
tlsr8266-radio = { path = "crates/tlsr8266-radio" }
tlsr8266-platform = { path = "crates/tlsr8266-platform" }
embassy-time = { version = "0.5", features = ["tick-hz-32_000_000"] }
embassy-executor = { version = "0.10", features = [] }
embassy-sync = "0.8"
static_cell = "2"
portable-atomic = { version = "1", features = ["critical-section"] }
heapless = "0.9"
critical-section = { version = "1.2", features = ["restore-state-u8"] }
fixed = "1.29"
const_format = "0.2"

[dev-dependencies]
futures = "0.3.31"

[features]
# If enabled, mirror log output into the `_TLSR_RTT` ring for a SWire-attached host.
rtt = ["tlsr8266-hal/rtt", "tlsr8266-platform/rtt"]
